name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Prisma/Next can generate and build in CI. No real
      # secrets are needed — the app is not started, only built and tested.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-secret-not-for-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
