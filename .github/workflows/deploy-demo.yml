# Publishes the read-only static demo to GitHub Pages on every push to main.
#
# The live app is server-rendered and needs a database; this deploys the
# content half of it as a static export. See scripts/build-demo.mjs and
# docs/deployment.md for what is and is not included.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the static demo
        # Must match the repository name: the site is served from
        # https://<user>.github.io/<repo>/
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/build-demo.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .demo-build/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
