<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="Simplified side view of the lower leg: gastrocnemius, soleus, and tibialis anterior">
  <title>Lower leg — gastrocnemius, soleus, and tibialis anterior (simplified)</title>
  <desc>Side view of the lower leg showing the rounded gastrocnemius and deeper soleus forming the calf at the back, and the tibialis anterior running along the front of the shin down to the foot.</desc>
  <style>
    .label { font: 600 12px system-ui, sans-serif; fill: #0f172a; }
    .muscle { opacity: 0.45; stroke-width: 1.5; }
    .bone { fill: #cbd5e1; stroke: #475569; stroke-width: 1; }
    .gastroc { fill: #ef4444; stroke: #b91c1c; }
    .soleus { fill: #f59e0b; stroke: #b45309; }
    .tibant { fill: #3b82f6; stroke: #1d4ed8; }
    .lead { stroke: #475569; stroke-width: 1; }
  </style>
  <!-- tibia/fibula shaft -->
  <rect class="bone" x="185" y="60" width="18" height="200" rx="6" />
  <!-- foot -->
  <path class="bone" d="M170,260 L230,260 L245,280 L170,280 Z" />
  <!-- soleus (deeper, behind) -->
  <path class="muscle soleus" d="M203,110 Q235,160 220,220 L203,225 L203,110 Z" />
  <!-- gastrocnemius (superficial calf bulge) -->
  <path class="muscle gastroc" d="M203,80 Q245,120 225,190 L203,195 L203,80 Z" />
  <!-- tibialis anterior -->
  <path class="muscle tibant" d="M185,90 Q165,160 175,240 L188,240 L188,90 Z" />
  <line class="lead" x1="225" y1="110" x2="300" y2="90" />
  <text class="label" x="230" y="86">Gastrocnemius</text>
  <line class="lead" x1="222" y1="180" x2="300" y2="200" />
  <text class="label" x="252" y="204">Soleus</text>
  <line class="lead" x1="175" y1="160" x2="70" y2="150" />
  <text class="label" x="4" y="148">Tibialis anterior</text>
</svg>
