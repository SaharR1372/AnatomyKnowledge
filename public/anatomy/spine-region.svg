<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="200" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">The Vertebral Column (Spine)</text>

  <!-- Spine outline (sagittal view - side view) -->
  <defs>
    <linearGradient id="vertebraGradient" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#e8d4c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="discGradient" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#cc7777;stop-opacity:0.7" />
    </linearGradient>
  </defs>

  <!-- Cervical region (C1-C7) -->
  <g id="cervical">
    <text x="350" y="70" font-size="11" font-weight="bold" fill="#333">Cervical (C1-C7)</text>
    <!-- Vertebrae -->
    <circle cx="200" cy="60" r="8" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="80" r="8" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="100" r="8" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <!-- Discs -->
    <ellipse cx="200" cy="70" rx="10" ry="5" fill="url(#discGradient)" opacity="0.6"/>
    <ellipse cx="200" cy="90" rx="10" ry="5" fill="url(#discGradient)" opacity="0.6"/>
  </g>

  <!-- Thoracic region (T1-T12) -->
  <g id="thoracic">
    <text x="350" y="180" font-size="11" font-weight="bold" fill="#333">Thoracic (T1-T12)</text>
    <!-- Vertebrae -->
    <circle cx="200" cy="120" r="9" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="145" r="9" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="170" r="9" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="195" r="9" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="220" r="9" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <!-- Discs -->
    <ellipse cx="200" cy="132" rx="11" ry="5" fill="url(#discGradient)" opacity="0.6"/>
    <ellipse cx="200" cy="157" rx="11" ry="5" fill="url(#discGradient)" opacity="0.6"/>
    <ellipse cx="200" cy="182" rx="11" ry="5" fill="url(#discGradient)" opacity="0.6"/>
    <ellipse cx="200" cy="207" rx="11" ry="5" fill="url(#discGradient)" opacity="0.6"/>
  </g>

  <!-- Lumbar region (L1-L5) -->
  <g id="lumbar">
    <text x="350" y="310" font-size="11" font-weight="bold" fill="#333">Lumbar (L1-L5)</text>
    <!-- Vertebrae (largest) -->
    <circle cx="200" cy="245" r="11" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="275" r="11" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <circle cx="200" cy="305" r="11" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
    <!-- Discs -->
    <ellipse cx="200" cy="260" rx="13" ry="6" fill="url(#discGradient)" opacity="0.6"/>
    <ellipse cx="200" cy="290" rx="13" ry="6" fill="url(#discGradient)" opacity="0.6"/>
  </g>

  <!-- Sacrum -->
  <g id="sacrum">
    <text x="350" y="370" font-size="11" font-weight="bold" fill="#333">Sacrum (S1-S5 fused)</text>
    <path d="M 190 330 L 210 330 L 215 370 L 185 370 Z" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Coccyx -->
  <g id="coccyx">
    <text x="350" y="410" font-size="11" font-weight="bold" fill="#333">Coccyx (tailbone)</text>
    <path d="M 195 375 L 205 375 L 202 400 L 198 400 Z" fill="url(#vertebraGradient)" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Spinal cord visualization (central line) -->
  <line x1="200" y1="50" x2="200" y2="400" stroke="#0066cc" stroke-width="2" opacity="0.5"/>
  <text x="145" y="225" font-size="10" fill="#0066cc" font-style="italic">Spinal cord</text>

  <!-- Natural curve annotations -->
  <!-- Cervical lordosis arrow -->
  <path d="M 160 80 Q 140 80 140 60" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="115" y="70" font-size="9" fill="#666">Lordosis</text>

  <!-- Thoracic kyphosis arrow -->
  <path d="M 160 170 Q 140 170 140 180" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="100" y="180" font-size="9" fill="#666">Kyphosis</text>

  <!-- Lumbar lordosis arrow -->
  <path d="M 160 275 Q 140 275 140 295" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="110" y="305" font-size="9" fill="#666">Lordosis</text>

  <!-- Legend -->
  <g>
    <rect x="20" y="430" width="360" height="150" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>

    <text x="30" y="450" font-size="12" font-weight="bold" fill="#333">Key Points:</text>

    <text x="30" y="470" font-size="10" fill="#333">• 33 total vertebrae (7 cervical + 12 thoracic + 5 lumbar + 5 sacral fused + 4 coccygeal fused)</text>

    <text x="30" y="485" font-size="10" fill="#333">• Intervertebral discs between each vertebra act as shock absorbers</text>

    <text x="30" y="500" font-size="10" fill="#333">• Natural curves (cervical lordosis, thoracic kyphosis, lumbar lordosis) are essential</text>

    <text x="30" y="515" font-size="10" fill="#333">• The spinal cord runs through the center, protected by the vertebral canal</text>

    <text x="30" y="530" font-size="10" fill="#333">• Lumbar vertebrae are the largest; they bear most body weight</text>

    <text x="30" y="545" font-size="10" fill="#333">• Heavy loaded spinal flexion increases disc-herniation risk</text>

    <text x="30" y="560" font-size="10" fill="#333">• Neutral spine maintains natural curves and distributes load evenly</text>
  </g>

  <!-- Copyright -->
  <text x="200" y="595" font-size="9" fill="#999" text-anchor="middle">CC0 · Educational anatomy diagram</text>
</svg>
