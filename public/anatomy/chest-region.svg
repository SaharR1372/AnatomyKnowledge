<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="Simplified front view of the chest: rib cage, sternum, and pectoralis major">
  <title>Chest region — rib cage, sternum, and pectoralis major (simplified)</title>
  <desc>Front view of the chest showing the sternum in the middle, ribs curving to each side, and the fan-shaped pectoralis major over the upper chest.</desc>
  <style>
    .label { font: 600 12px system-ui, sans-serif; fill: #0f172a; }
    .bone { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
    .muscle { fill: #ef4444; opacity: 0.35; stroke: #b91c1c; stroke-width: 1.5; }
    .lead { stroke: #475569; stroke-width: 1; }
  </style>
  <!-- pectoralis major (both sides) -->
  <path class="muscle" d="M180,80 Q120,85 110,140 Q150,165 180,150 Z" />
  <path class="muscle" d="M180,80 Q240,85 250,140 Q210,165 180,150 Z" />
  <!-- sternum -->
  <rect class="bone" x="173" y="80" width="14" height="110" rx="5" />
  <!-- ribs (curved lines) -->
  <g fill="none" class="bone">
    <path d="M173,95 Q120,100 105,135" />
    <path d="M187,95 Q240,100 255,135" />
    <path d="M173,115 Q118,125 108,160" />
    <path d="M187,115 Q242,125 252,160" />
    <path d="M173,135 Q120,150 112,185" />
    <path d="M187,135 Q240,150 248,185" />
  </g>
  <line class="lead" x1="180" y1="120" x2="180" y2="235" />
  <text class="label" x="150" y="250">Sternum</text>
  <line class="lead" x1="120" y1="120" x2="60" y2="110" />
  <text class="label" x="14" y="108">Pectoralis major</text>
  <line class="lead" x1="250" y1="150" x2="300" y2="160" />
  <text class="label" x="290" y="176">Ribs</text>
</svg>
